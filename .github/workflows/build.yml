name: Build ZenOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "profile/**"
      - "arm64/**"
      - "overlay/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
permissions:
  contents: read
concurrency:
  group: zenos-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate scripts and profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          set -euo pipefail
          bash -n profile/profiledef.sh
          bash -n arm64/build-rootfs.sh
          bash -n arm64/build-uefi-image.sh
          bash -n scripts/zenos-welcome
          for script in scripts/*; do bash -n "$script"; done
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=error scripts/* arm64/*.sh
      - name: Check whitespace errors
        run: git diff --check
  x86_64:
    name: x86-64 live ISO
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build Archiso image
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm --privileged -v "$GITHUB_WORKSPACE:/work" -w /work archlinux:latest bash -euo pipefail -c '
            pacman -Syu --noconfirm archiso
            mkdir -p /tmp/zenos-profile
            cp -a /usr/share/archiso/configs/releng/. /tmp/zenos-profile/
            cp /work/profile/profiledef.sh /tmp/zenos-profile/profiledef.sh
            cp /work/profile/packages.x86_64 /tmp/zenos-profile/packages.x86_64
            cp /work/profile/pacman.conf /tmp/zenos-profile/pacman.conf
            mkdir -p /tmp/zenos-profile/airootfs
            cp -a /work/overlay/. /tmp/zenos-profile/airootfs/
            install -D -m 0644 /work/profile/airootfs/etc/mkinitcpio.conf.d/archiso.conf /tmp/zenos-profile/airootfs/etc/mkinitcpio.conf.d/archiso.conf
            grep -Eq '^HOOKS=.*archiso.*archiso_loop_mnt' /tmp/zenos-profile/airootfs/etc/mkinitcpio.conf.d/archiso.conf
            install -d /tmp/zenos-profile/airootfs/usr/local/bin /tmp/zenos-profile/airootfs/usr/local/sbin
            install -m 0755 /work/scripts/zenos-app /tmp/zenos-profile/airootfs/usr/local/bin/zenos-app
            install -m 0755 /work/scripts/zenos-install /tmp/zenos-profile/airootfs/usr/local/bin/zenos-install
            install -m 0755 /work/scripts/zenos-firstboot /tmp/zenos-profile/airootfs/usr/local/sbin/zenos-firstboot
            install -m 0755 /work/scripts/zenos-theme-apply /tmp/zenos-profile/airootfs/usr/local/bin/zenos-theme-apply
            install -m 0755 /work/scripts/zenos-desktop-first-login /tmp/zenos-profile/airootfs/usr/local/bin/zenos-desktop-first-login
            install -m 0755 /work/scripts/zenos-welcome /tmp/zenos-profile/airootfs/usr/local/bin/zenos-welcome
            install -d /tmp/zenos-profile/airootfs/etc/systemd/system/multi-user.target.wants /tmp/zenos-profile/airootfs/etc/systemd/system/graphical.target.wants
            ln -sf /usr/lib/systemd/system/NetworkManager.service /tmp/zenos-profile/airootfs/etc/systemd/system/multi-user.target.wants/NetworkManager.service
            ln -sf /usr/lib/systemd/system/bluetooth.service /tmp/zenos-profile/airootfs/etc/systemd/system/multi-user.target.wants/bluetooth.service
            ln -sf /usr/lib/systemd/system/cups.service /tmp/zenos-profile/airootfs/etc/systemd/system/multi-user.target.wants/cups.service
            ln -sf /usr/lib/systemd/system/avahi-daemon.service /tmp/zenos-profile/airootfs/etc/systemd/system/multi-user.target.wants/avahi-daemon.service
            ln -sf /usr/lib/systemd/system/firewalld.service /tmp/zenos-profile/airootfs/etc/systemd/system/multi-user.target.wants/firewalld.service
            ln -sf /usr/lib/systemd/system/systemd-timesyncd.service /tmp/zenos-profile/airootfs/etc/systemd/system/multi-user.target.wants/systemd-timesyncd.service
            ln -sf /usr/lib/systemd/system/sddm.service /tmp/zenos-profile/airootfs/etc/systemd/system/graphical.target.wants/sddm.service
            ln -sf /usr/lib/systemd/system/sddm.service /tmp/zenos-profile/airootfs/etc/systemd/system/display-manager.service
            ln -sf /etc/systemd/system/zenos-firstboot-tty.service /tmp/zenos-profile/airootfs/etc/systemd/system/multi-user.target.wants/zenos-firstboot-tty.service
            mkarchiso -v -w /tmp/archiso-work -o /work/out /tmp/zenos-profile
          '
          sha256sum out/*.iso > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: zenos-x86_64-iso
          path: out/*
          if-no-files-found: error
          compression-level: 0
  aarch64:
    name: ARM64 Arch Linux ARM rootfs
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build ARM64 root filesystem
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gnupg
          sudo --preserve-env=RUNNER_TEMP bash arm64/build-rootfs.sh "$RUNNER_TEMP/zenos-aarch64"
          sudo apt-get update
          sudo apt-get install -y dosfstools e2fsprogs parted rsync zstd util-linux
          mkdir -p out
          sudo tar --numeric-owner --xattrs -C "$RUNNER_TEMP/zenos-aarch64" -czf out/zenos-aarch64-rootfs.tar.gz .
          sudo bash arm64/build-uefi-image.sh "$RUNNER_TEMP/zenos-aarch64" "$GITHUB_WORKSPACE/out/zenos-aarch64-uefi.img.zst"
          sudo chown "$USER":"$USER" out/zenos-aarch64-rootfs.tar.gz out/zenos-aarch64-uefi.img.zst
          sha256sum out/zenos-aarch64-rootfs.tar.gz out/zenos-aarch64-uefi.img.zst > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: zenos-aarch64-rootfs
          path: |
            out/zenos-aarch64-rootfs.tar.gz
            out/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: zenos-aarch64-uefi-image
          path: |
            out/zenos-aarch64-uefi.img.zst
            out/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
