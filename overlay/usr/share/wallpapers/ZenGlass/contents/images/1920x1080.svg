    <circle cx="560" cy="420" r="86" fill="none" stroke="#ffffff" stroke-opacity=".24" stroke-width="2"/>
    <circle cx="1325" cy="640" r="175" fill="url(#orb)" stroke="#e4fbff" stroke-opacity=".34" stroke-width="2"/>
    <circle cx="1325" cy="640" r="125" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="2"/>
    <circle cx="1060" cy="360" r="46" fill="#dffaff" opacity=".14" filter="url(#blur28)"/>
    <circle cx="890" cy="730" r="26" fill="#dffaff" opacity=".28" filter="url(#blur28)"/>
  </g>
  <g fill="none" stroke="#e8fbff" stroke-opacity=".18">
