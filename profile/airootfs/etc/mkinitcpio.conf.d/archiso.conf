# ZenOS live ISO initramfs configuration.
# Archiso must discover the CD/DVD, mount the squashfs image, and expose its root.
MODULES=(squashfs loop)
HOOKS=(base udev microcode modconf memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-6)
